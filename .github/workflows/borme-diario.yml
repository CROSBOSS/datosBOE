name: BORME diario

on:
  schedule:
    - cron: "20 7 * * 1-5"   # L-V 07:20 UTC (08:20 Madrid en invierno), tras la publicación del BORME
  push:
    branches: [main]
    paths: ["site/**", "borme/**", ".github/workflows/**"]
  workflow_dispatch:
    inputs:
      desde:
        description: "Fecha inicio AAAA-MM-DD (vacío = últimos 5 días)"
        required: false
      hasta:
        description: "Fecha fin AAAA-MM-DD (vacío = hoy)"
        required: false
      provincias:
        description: "Códigos INE separados por comas (vacío = todas)"
        required: false
        default: "46"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: borme
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install requests pytest

      - name: Tests del parser
        run: python -m pytest -q

      - name: Descargar BORME
        env:
          DESDE: ${{ inputs.desde }}
          HASTA: ${{ inputs.hasta }}
          PROVINCIAS: ${{ github.event_name == 'workflow_dispatch' && inputs.provincias || '46' }}
        run: |
          DESDE="${DESDE:-$(date -u -d '5 days ago' +%F)}"
          HASTA="${HASTA:-$(date -u +%F)}"
          ARGS=""
          for p in ${PROVINCIAS//,/ }; do ARGS="$ARGS --provincia $p"; done
          python -m borme.ingest --desde "$DESDE" --hasta "$HASTA" $ARGS

      - name: Cargar en SQLite
        run: python -m borme.db

      - name: Informe
        run: python -m borme.informe >> "$GITHUB_STEP_SUMMARY"

      - name: Exportar datos para la web
        run: python -m borme.exportar --db data/borme.sqlite --out site/data.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Guardar datos en el repo
        run: |
          git config user.name "borme-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Datos BORME $(date -u +%F)"
          git push

  web:
    needs: actualizar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
