name: BORME diario

on:
  schedule:
    - cron: "20 7 * * 1-5"   # L-V 07:20 UTC (08:20 Madrid en invierno), tras la publicación del BORME
  push:
    branches: [main]
    paths: ["site/**", "borme/**", ".github/workflows/**"]
  workflow_dispatch:
    inputs:
      desde:
        description: "Fecha inicio AAAA-MM-DD (vacío = últimos 5 días)"
        required: false
      hasta:
        description: "Fecha fin AAAA-MM-DD (vacío = hoy)"
        required: false
      provincias:
        description: "Códigos INE separados por comas (vacío = todas)"
        required: false
        default: "46"
      reprocesar:
        description: "Reconstruir la base desde todos los XML guardados (tras cambiar el parser)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: borme
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Tests del parser
        run: python -m pytest -q

      # Los datos viven en la release "datos" (la base supera el límite de ficheros de git)
      - name: Recuperar datos anteriores
        env:
          REPROCESAR: ${{ inputs.reprocesar }}
        run: |
          mkdir -p data/raw
          if [ "$REPROCESAR" = "true" ]; then
            echo "Reprocesando desde los XML guardados"
            gh release download datos -p 'raw-*.tar.gz' -D /tmp/raw --clobber || true
            for t in /tmp/raw/raw-*.tar.gz; do [ -f "$t" ] && tar -xzf "$t" -C data/raw; done
            rm -f data/borme.sqlite
          elif gh release download datos -p borme.sqlite.gz -D data --clobber; then
            gunzip -f data/borme.sqlite.gz
          else
            echo "Sin base previa: se construye desde los XML del repositorio"
          fi

      - name: Descargar BORME
        env:
          DESDE: ${{ inputs.desde }}
          HASTA: ${{ inputs.hasta }}
          PROVINCIAS: ${{ github.event_name == 'workflow_dispatch' && inputs.provincias || '46' }}
        run: |
          DESDE="${DESDE:-$(date -u -d '5 days ago' +%F)}"
          HASTA="${HASTA:-$(date -u +%F)}"
          ARGS=""
          for p in ${PROVINCIAS//,/ }; do ARGS="$ARGS --provincia $p"; done
          python -m borme.ingest --desde "$DESDE" --hasta "$HASTA" $ARGS

      - name: Cargar en SQLite
        run: python -m borme.db

      - name: Clasificar por actividad (CNAE)
        run: python -m borme.cnae

      - name: Informe
        run: python -m borme.informe >> "$GITHUB_STEP_SUMMARY"

      - name: Contexto por sector (noticias GDELT y normativa BOE)
        continue-on-error: true
        run: python -m borme.contexto --out site/contexto.json

      - name: Exportar datos para la web
        run: python -m borme.exportar --db data/borme.sqlite --out site/data.json

      - name: Guardar datos en la release
        run: |
          gh release view datos >/dev/null 2>&1 || gh release create datos --title "Datos BORME" \
            --notes "Base de datos (borme.sqlite.gz) y XML en bruto por año (raw-AAAA.tar.gz). Los actualiza el workflow diario."
          gzip -kf data/borme.sqlite
          gh release upload datos data/borme.sqlite.gz site/data.json $( [ -f site/contexto.json ] && echo site/contexto.json ) --clobber
          for y in $(ls data/raw); do
            rm -rf /tmp/prev && mkdir -p /tmp/prev
            if gh release download datos -p "raw-$y.tar.gz" -D /tmp/prev 2>/dev/null; then
              tar -xzf "/tmp/prev/raw-$y.tar.gz" -C data/raw
            fi
            tar -czf "/tmp/raw-$y.tar.gz" -C data/raw "$y"
            gh release upload datos "/tmp/raw-$y.tar.gz" --clobber
          done

      - uses: actions/upload-pages-artifact@v3
        if: vars.PAGES_ENABLED == 'true'
        with:
          path: site

  web:
    needs: actualizar
    if: vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
